# Catalog QA (wekelijks): controleert alle gepubliceerde shirts op ontbrekende velden die Merchant, Pinterest
# en aggregators nodig hebben. Alleen lezen. Houdt EEN issue "Catalogus-QA (automatisch)" bij.
# Beoordeelt nooit echtheid of herkomst (AGENTS.md: mens beslist over match-worn-claims).
name: Catalogus-QA

on:
  schedule:
    - cron: '17 5 * * 1'          # maandag, ongeveer 07:17 Nederlandse tijd
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rapport maken
        run: node scripts/catalog-qa.js | tee qa.md >> "$GITHUB_STEP_SUMMARY"
      - name: Issue bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Catalogus-QA (automatisch)"
          { echo "Stand van $(date -u +%F), automatisch bijgewerkt door .github/workflows/catalogus-qa.yml."; echo; head -c 60000 qa.md; } > body.md
          NUM=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          if [ -n "$NUM" ]; then gh issue edit "$NUM" --body-file body.md; else gh issue create --title "$TITLE" --label controle --body-file body.md; fi
